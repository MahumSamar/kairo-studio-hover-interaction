<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kairo Studio — Rise gently</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://d8j0ntlcm91z4.cloudfront.net" crossorigin>
<style>
  :root {
    --paper: #f7f5ef;
    --ink: #111111;
    --cobalt: #1d4fbf;
    --sky: #a9cbf3;
    --gold: #c9a24b;

    /* the dragon artwork is a square; this is its on-screen side */
    --dragon: min(112svh, 168vw);
  }

  * { box-sizing: border-box; margin: 0; }

  html, body { height: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Jost", "Century Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .hero {
    position: relative;
    height: 100vh;
    height: 100svh;
    min-height: 480px;
    overflow: hidden;
    isolation: isolate;
    background: var(--paper);
  }

  /* ---------- layer 1: watercolour cloud ---------- */
  .wash {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* ---------- layer 2: corner florals ---------- */
  .floral {
    position: absolute;
    z-index: 2;
    width: min(30vw, 52svh);
    pointer-events: none;
    user-select: none;
  }
  .floral--tr { top: -5svh; right: -3vw; }
  .floral--bl { bottom: -5svh; left: -3vw; transform: rotate(180deg); }

  /* ---------- layer 3: headline, behind the dragon ---------- */
  .headline {
    position: absolute;
    z-index: 3;
    left: 50%;
    top: 52%;
    transform: translate(-50%, -50%);
    font-family: "Playfair Display", "Bodoni MT", Didot, serif;
    font-style: italic;
    font-weight: 500;
    font-size: min(24vw, 43svh);
    line-height: 0.8;
    letter-spacing: -0.035em;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .headline span { display: block; }
  .headline span:nth-child(2) { padding-left: 0.72em; }

  /* ---------- layer 4: dragon, in front of the headline ---------- */
  .dragon {
    position: absolute;
    z-index: 4;
    left: 50%;
    top: 50%;
    width: var(--dragon);
    height: var(--dragon);
    /* nudges the dragon's body (not the square) onto the hero's centre line */
    transform: translate(-52%, -47%);
    pointer-events: none;
  }
  .dragon canvas,
  .dragon img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .dragon canvas { opacity: 0; transition: opacity 0.5s ease; }
  .dragon img { transition: opacity 0.5s ease; }
  .dragon .back { opacity: 0; }
  .dragon.is-live canvas { opacity: 1; }
  .dragon.is-live img { opacity: 0; }
  /* no-WebGL fallback: plain crossfade on hover */
  .hero:hover .dragon:not(.is-live) .back { opacity: 1; }

  /* ---------- layer 5: navigation ---------- */
  .nav {
    position: absolute;
    z-index: 5;
    inset: 0 0 auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 18px 32px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .nav a {
    color: inherit;
    text-decoration: none;
    padding: 6px 0;
    background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat;
    transition: background-size 0.35s cubic-bezier(.2,.7,.2,1);
  }
  .nav a:hover { background-size: 100% 1px; }
  .nav ul {
    display: flex;
    flex: 1;
    justify-content: space-around;
    list-style: none;
    padding: 0 0 0 4vw;
  }
  .menu {
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.25s, color 0.25s;
  }
  .menu:hover { background: var(--ink); color: var(--paper); }
  .nav a:focus-visible,
  .menu:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 4px; }

  @media (max-width: 760px) {
    .nav { padding: 16px 20px; }
    .nav ul { display: none; }
    .headline { top: 50%; font-size: min(31vw, 30svh); }
    .floral { width: 72vw; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dragon canvas, .dragon img, .nav a, .menu { transition: none; }
  }
</style>
</head>
<body>

<header class="hero" id="hero">
  <canvas class="wash" id="wash" aria-hidden="true"></canvas>

  <img class="floral floral--tr" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261004_073106_56d0499c-5908-4447-86b8-465d712ca552.png">
  <img class="floral floral--bl" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261004_073106_56d0499c-5908-4447-86b8-465d712ca552.png">

  <h1 class="headline"><span>Rise</span><span>gently</span></h1>

  <div class="dragon" id="dragon">
    <img class="front" id="front" crossorigin="anonymous"
         alt="A white porcelain dragon coiled in an S-curve; moving the pointer over it reveals cobalt-blue cloud motifs and gold kintsugi seams."
         src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261004_073040_d706a5ff-b2fc-4330-923c-b16405025697.png">
    <img class="back" id="back" crossorigin="anonymous" alt=""
         src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261004_073023_751a55cc-be81-4346-9f91-3c00987f54ef.png">
    <canvas id="reveal" aria-hidden="true"></canvas>
  </div>

  <nav class="nav" aria-label="Primary">
    <a href="#">Kairo Studio / Est. 2026</a>
    <ul>
      <li><a href="#">Listen</a></li>
      <li><a href="#">Culture &amp; Makers</a></li>
      <li><a href="#">Learn</a></li>
      <li><a href="#">Reserve</a></li>
    </ul>
    <button class="menu" type="button" aria-label="Open menu">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">
        <circle cx="1.5" cy="1.5" r="1"/><circle cx="6" cy="1.5" r="1"/><circle cx="10.5" cy="1.5" r="1"/>
        <circle cx="1.5" cy="6" r="1"/><circle cx="6" cy="6" r="1"/><circle cx="10.5" cy="6" r="1"/>
        <circle cx="1.5" cy="10.5" r="1"/><circle cx="6" cy="10.5" r="1"/><circle cx="10.5" cy="10.5" r="1"/>
      </svg>
    </button>
  </nav>
</header>

<script>
(() => {
  const hero = document.getElementById('hero');
  const dragonEl = document.getElementById('dragon');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Mouse-trail settings, named after the Unicorn Studio controls they mirror. */
  const TRAIL = {
    radius: 0.105,      // brush size, as a fraction of the dragon square
    strength: 1.0,
    dissipation: 0.966, // per-frame fade at 60fps
    momentum: 9,        // how quickly the brush catches up with the cursor
    fluidity: 1.7,      // how much the trail drifts like ink in water
    simSize: 256
  };

  const VERT = `
    attribute vec2 aPos;
    varying vec2 vUv;
    void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

  const NOISE = `
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x),
                 mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + 17.1; a *= 0.5; }
      return v;
    }`;

  function program(gl, fragSrc) {
    const make = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const p = gl.createProgram();
    gl.attachShader(p, make(gl.VERTEX_SHADER, VERT));
    gl.attachShader(p, make(gl.FRAGMENT_SHADER, 'precision highp float;\n' + fragSrc));
    gl.bindAttribLocation(p, 0, 'aPos');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const name = gl.getActiveUniform(p, i).name;
      u[name] = gl.getUniformLocation(p, name);
    }
    return { p, u };
  }

  function quad(gl) {
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  }

  /* =====================================================================
     Watercolour cloud — a gradient blob, displaced by FBM, feathered, grained
     ===================================================================== */
  const wash = (() => {
    const canvas = document.getElementById('wash');
    const gl = canvas.getContext('webgl', { premultipliedAlpha: true, antialias: false });
    if (!gl) return null;
    let prog;
    try {
      prog = program(gl, NOISE + `
        uniform vec2 uCenter;
        uniform float uSide, uTime;
        void main() {
          vec2 p = (gl_FragCoord.xy - uCenter) / uSide;
          p.x *= 0.66;
          float t = uTime * 0.02;
          vec2 q = p * 2.4;
          vec2 w = vec2(fbm(q + t), fbm(q + vec2(5.2, 1.3) - t));
          float n = fbm(q * 1.3 + w * 2.2);
          float n2 = fbm(q * 3.6 + w * 3.0 + 9.0);

          float f = (1.0 - length(p) / 0.45) + (n - 0.5) * 1.25;
          float a = smoothstep(0.0, 0.2, f);
          a *= smoothstep(-0.05, 0.3, f + (n2 - 0.5) * 1.0);

          vec3 sky = vec3(0.663, 0.796, 0.953);
          vec3 cobalt = vec3(0.114, 0.310, 0.749);
          float depth = smoothstep(0.12, 0.85, f * (0.45 + n2 * 1.15));
          vec3 col = mix(sky, cobalt, depth);
          col = mix(col, vec3(0.97, 0.98, 1.0), smoothstep(0.6, 0.85, n2) * 0.5);
          a *= 0.6 + 0.4 * depth;

          float grain = hash(gl_FragCoord.xy) - 0.5;
          a = clamp(a + grain * 0.14 * a, 0.0, 1.0);
          gl_FragColor = vec4(col * a, a);
        }`);
    } catch (e) { console.warn(e); return null; }
    quad(gl);
    gl.useProgram(prog.p);

    let cx = 0, cy = 0, side = 1;
    function resize() {
      const scale = Math.min(devicePixelRatio || 1, 1.5) * 0.75;
      const r = hero.getBoundingClientRect();
      canvas.width = Math.max(2, Math.round(r.width * scale));
      canvas.height = Math.max(2, Math.round(r.height * scale));
      const d = dragonEl.getBoundingClientRect();
      // the dragon's body sits slightly right of the square's centre
      cx = (d.left - r.left + d.width * 0.53) * scale;
      cy = (r.height - (d.top - r.top + d.height * 0.5)) * scale;
      side = d.width * scale;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    function draw(time) {
      gl.uniform2f(prog.u.uCenter, cx, cy);
      gl.uniform1f(prog.u.uSide, side);
      gl.uniform1f(prog.u.uTime, time);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    return { resize, draw };
  })();

  /* =====================================================================
     Dragon — plain white on top, painted version revealed along the trail
     ===================================================================== */
  const reveal = (() => {
    const canvas = document.getElementById('reveal');
    const gl = canvas.getContext('webgl', { premultipliedAlpha: true, antialias: false });
    if (!gl) return null;
    let sim, show;
    try {
      sim = program(gl, NOISE + `
        uniform sampler2D uPrev;
        uniform vec2 uA, uB, uTexel;
        uniform float uStrength, uRadius, uDecay, uFrames, uFluid, uTime;
        varying vec2 vUv;
        void main() {
          vec2 flow = vec2(noise(vUv * 5.0 + vec2(0.0, uTime * 0.3)),
                           noise(vUv * 5.0 + vec2(7.3, -uTime * 0.3))) - 0.5;
          vec2 uv = vUv - flow * uTexel * uFluid * 2.0;
          float c = texture2D(uPrev, uv).r * 0.5
                  + (texture2D(uPrev, uv + vec2(uTexel.x, 0.0)).r
                  +  texture2D(uPrev, uv - vec2(uTexel.x, 0.0)).r
                  +  texture2D(uPrev, uv + vec2(0.0, uTexel.y)).r
                  +  texture2D(uPrev, uv - vec2(0.0, uTexel.y)).r) * 0.125;
          c = c * uDecay - 0.003 * uFrames;
          vec2 pa = vUv - uA, ba = uB - uA;
          float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
          float d = length(pa - ba * h);
          c += smoothstep(uRadius, 0.0, d) * uStrength;
          gl_FragColor = vec4(vec3(clamp(c, 0.0, 1.0)), 1.0);
        }`);
      show = program(gl, NOISE + `
        uniform sampler2D uMask, uFront, uBack;
        varying vec2 vUv;
        void main() {
          float m = texture2D(uMask, vUv).r;
          float n = fbm(vUv * 11.0);
          m = smoothstep(0.1, 0.55, m + (n - 0.5) * 0.55 * smoothstep(0.0, 0.3, m));
          gl_FragColor = mix(texture2D(uFront, vUv), texture2D(uBack, vUv), m);
        }`);
    } catch (e) { console.warn(e); return null; }
    quad(gl);

    const N = TRAIL.simSize;
    function target() {
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, N, N, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      const fbo = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      return { tex, fbo };
    }
    let read = target(), write = target();

    function imageTexture(img) {
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return tex;
    }
    let front, back;
    function load(frontImg, backImg) {
      front = imageTexture(frontImg);
      back = imageTexture(backImg);
    }

    function resize() {
      const r = dragonEl.getBoundingClientRect();
      const size = Math.min(2048, Math.round(r.width * Math.min(devicePixelRatio || 1, 2)));
      canvas.width = canvas.height = Math.max(2, size);
    }

    function step(a, b, strength, frames, time) {
      gl.useProgram(sim.p);
      gl.bindFramebuffer(gl.FRAMEBUFFER, write.fbo);
      gl.viewport(0, 0, N, N);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, read.tex);
      gl.uniform1i(sim.u.uPrev, 0);
      gl.uniform2f(sim.u.uA, a[0], a[1]);
      gl.uniform2f(sim.u.uB, b[0], b[1]);
      gl.uniform2f(sim.u.uTexel, 1 / N, 1 / N);
      gl.uniform1f(sim.u.uStrength, strength);
      gl.uniform1f(sim.u.uRadius, TRAIL.radius);
      gl.uniform1f(sim.u.uDecay, Math.pow(TRAIL.dissipation, frames));
      gl.uniform1f(sim.u.uFrames, frames);
      gl.uniform1f(sim.u.uFluid, TRAIL.fluidity);
      gl.uniform1f(sim.u.uTime, time);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      [read, write] = [write, read];
    }

    function draw() {
      gl.useProgram(show.p);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, read.tex);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, front);
      gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, back);
      gl.uniform1i(show.u.uMask, 0);
      gl.uniform1i(show.u.uFront, 1);
      gl.uniform1i(show.u.uBack, 2);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    return { load, resize, step, draw };
  })();

  /* ---------- pointer → brush, in the dragon square's UV space ---------- */
  let rect = dragonEl.getBoundingClientRect();
  const aim = [0.5, 0.5];   // where the cursor is
  const brush = [0.5, 0.5]; // where the brush has caught up to
  let hasPointer = false;
  let intro = reduceMotion ? 1 : 0; // 0..1 progress of the opening sweep

  function toUv(x, y) {
    return [(x - rect.left) / rect.width, 1 - (y - rect.top) / rect.height];
  }
  window.addEventListener('pointermove', (e) => {
    const uv = toUv(e.clientX, e.clientY);
    if (!hasPointer) { brush[0] = uv[0]; brush[1] = uv[1]; hasPointer = true; intro = 1; }
    aim[0] = uv[0]; aim[1] = uv[1];
  }, { passive: true });

  function resize() {
    rect = dragonEl.getBoundingClientRect();
    if (wash) wash.resize();
    if (reveal) reveal.resize();
    if (wash && reduceMotion) wash.draw(12);
  }
  window.addEventListener('resize', resize);

  /* ---------- frame loop ---------- */
  let last = performance.now();
  let live = false;
  function frame(now) {
    const elapsed = (now - last) / 1000;
    const dt = Math.min(0.05, elapsed);
    last = now;
    const time = now / 1000;

    if (wash && !reduceMotion) wash.draw(time);

    if (reveal && live) {
      // Opening sweep: the brush runs down the dragon's spine once, so the
      // effect is discoverable before the visitor moves (and on touch screens).
      if (intro < 1) {
        intro = Math.min(1, intro + dt / 1.6);
        const y = 0.9 - intro * 0.8;
        aim[0] = 0.53 + Math.sin(y * 9.5 + 1.2) * 0.13;
        aim[1] = y;
        if (!hasPointer && intro <= dt) { brush[0] = aim[0]; brush[1] = aim[1]; }
      }
      const from = [brush[0], brush[1]];
      const k = 1 - Math.exp(-dt * TRAIL.momentum);
      brush[0] += (aim[0] - brush[0]) * k;
      brush[1] += (aim[1] - brush[1]) * k;
      const moved = Math.hypot(brush[0] - from[0], brush[1] - from[1]);
      const strength = Math.min(1, moved * 90) * TRAIL.strength;
      // fade by real elapsed time, so a throttled tab doesn't leave a stale trail
      reveal.step(from, brush, strength, Math.min(elapsed, 1) * 60, time);
      reveal.draw();
    }
    requestAnimationFrame(frame);
  }

  /* ---------- boot ---------- */
  const frontImg = document.getElementById('front');
  const backImg = document.getElementById('back');
  const ready = (img) => img.decode ? img.decode() : new Promise((ok, no) => {
    if (img.complete) ok(); else { img.onload = ok; img.onerror = no; }
  });

  resize();
  if (reveal) {
    Promise.all([ready(frontImg), ready(backImg)]).then(() => {
      reveal.load(frontImg, backImg);
      resize();
      reveal.draw();
      dragonEl.classList.add('is-live');
      live = true;
    }).catch((e) => console.warn('Dragon reveal unavailable, using hover fallback.', e));
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
